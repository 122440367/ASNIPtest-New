name: ASN Cloudflare IP Detection

on:
  workflow_dispatch:
    inputs:
      asns:
        description: 'ASN 列表 (逗号分隔)'
        required: true
        default: 'AS61112,AS8888,AS906,AS25820'
        type: string
      port:
        description: '扫描端口'
        required: true
        default: '443'
        type: string
      masscan_rate:
        description: 'masscan 扫描发包速率 (pps)'
        required: true
        default: '10000'
        type: string
  schedule:
    # 每天北京时间 05:30 (即 UTC 21:30) 自动运行一次
    - cron: '30 21 * * *'

# 授予工作流向仓库写入/推送代码的权限
permissions:
  contents: write

jobs:
  asn-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub Actions 单任务上限 6 小时

    env:
      PYTHONUNBUFFERED: "1" # 禁用 Python 缓冲区，确保实时输出日志

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan prips dnsutils libpcap-dev

      - name: Compile cf-scanner
        run: |
          cd cf-scanner-src
          go build -o ../cf-scanner main.go
          chmod +x ../cf-scanner
          cd ..

      - name: Run ASN Scanner
        id: run_scanner
        run: |
          # Keep timestamped CSV files temporary; only result.csv is published.
          rm -f output_*.csv

          # 获取待扫描的 ASN、端口与速率
          ASNS="${{ github.event.inputs.asns || 'AS61112,AS8888,AS906' }}"
          PORT="${{ github.event.inputs.port || '443' }}"
          RATE="${{ github.event.inputs.masscan_rate || '10000' }}"

          echo "=========================================="
          echo "开始执行扫描任务"
          echo "目标 ASN: $ASNS"
          echo "目标端口: $PORT"
          echo "发包速率: $RATE pps"
          echo "测速选项: 自动跳过测速"
          echo "=========================================="

          # 通过管道输入 "n\n" 自动跳过测速，传递 MASSCAN_RATE 加快扫描
          printf "n\n" | sudo env "MASSCAN_RATE=$RATE" "PYTHONUNBUFFERED=1" python3 -u run.py $ASNS -p $PORT

      - name: Commit and Push Results to Repository Root
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 查找最新生成的 CSV 文件
          LATEST_CSV=$(ls -t output_*.csv 2>/dev/null | head -n 1)
          if [ -n "$LATEST_CSV" ]; then
            # 同时复制一份固定文件名为 result.csv，方便下游程序直接引用
            cp "$LATEST_CSV" result.csv
            
            # 添加到版本库（output_*.csv 已不再跟踪，无需清理）
            git add result.csv
            
            # 检查是否有文件变更
            if git diff --staged --quiet; then
              echo "没有检测到内容变化，跳过提交。"
            else
              git commit -m "chore(auto): update ASN scan results ($LATEST_CSV) [skip ci]"
              git push
              echo "✅ 已成功将结果推送到项目根目录！"
            fi
          else
            echo "⚠️ 未找到生成的 CSV 文件，跳过 Git 提交。"
          fi

      - name: Upload result.csv to Cloudflare Worker
        if: ${{ success() && hashFiles('result.csv') != '' }}
        env:
          SPD_WORKER_URL: ${{ secrets.SPD_WORKER_URL }}
          SPD_API_TOKEN: ${{ secrets.SPD_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SPD_WORKER_URL:-}" || -z "${SPD_API_TOKEN:-}" ]]; then
            echo "::error::未配置 GitHub Secrets SPD_WORKER_URL 或 SPD_API_TOKEN，无法上传到 Worker。"
            exit 1
          fi

          response_file="$(mktemp)"
          curl_error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$curl_error_file"' EXIT

          # 仅通过环境变量传递敏感信息；不输出 URL、Token 或 Worker 响应正文。
          worker_endpoint="${SPD_WORKER_URL%/}/upload-ips"
          clear_endpoint="${SPD_WORKER_URL%/}/clear-uploaded-ips"

          # Clear the Worker-side uploaded IP list before replacing it with this run's result.
          if ! clear_http_code="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${SPD_API_TOKEN}" \
            -o "$response_file" \
            -w '%{http_code}' \
            "$clear_endpoint" 2>"$curl_error_file")"; then
            echo "::error::清空 Worker 端 iplist.txt 失败，请检查 Worker 地址、Token 和网络连接。"
            exit 1
          fi

          if [[ "$clear_http_code" != 2* ]] || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
            echo "::error::Worker 拒绝清空 iplist.txt 请求（HTTP ${clear_http_code}）。"
            exit 1
          fi

          if ! http_code="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${SPD_API_TOKEN}" \
            -F "ipfile=@result.csv;type=text/csv" \
            -o "$response_file" \
            -w '%{http_code}' \
            "$worker_endpoint" 2>"$curl_error_file")"; then
            echo "::error::上传 result.csv 到 Worker 失败，请检查 Worker 地址、Token 和网络连接。"
            exit 1
          fi

          if [[ "$http_code" != 2* ]] || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
            echo "::error::Worker 拒绝了 result.csv 上传请求（HTTP ${http_code}）。"
            exit 1
          fi

          uploaded_count="$(jq -r '.count // .totalCount // "unknown"' "$response_file")"
          echo "已成功上传 result.csv 到 Worker，合并后 IP 数量：${uploaded_count}。"

      - name: Generate Summary in GitHub Step Summary
        if: always()
        run: |
          echo "### 📊 ASN 扫描结果报告" >> $GITHUB_STEP_SUMMARY
          if [ -f result.csv ]; then
            CSV_FILE="result.csv"
            TOTAL_COUNT=$(($(wc -l < "$CSV_FILE") - 1))
            echo "- **生成文件**: \`$CSV_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **最新文件别名**: \`result.csv\`" >> $GITHUB_STEP_SUMMARY
            echo "- **有效 Cloudflare 节点数**: **$TOTAL_COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 前 10 条节点预览" >> $GITHUB_STEP_SUMMARY
            echo "| IP地址 | 端口 | TLS | 数据中心 | 地区 | 城市 | ASN |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            tail -n +2 "$CSV_FILE" | head -n 10 | awk -F',' '{print "| "$1" | "$2" | "$3" | "$4" | "$5" | "$6" | "$9" |"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 未发现有效节点或扫描未产生输出 CSV 文件。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asn-cf-results-${{ github.run_id }}
          path: result.csv
          if-no-files-found: warn
